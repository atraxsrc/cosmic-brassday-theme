# BrassDay colour scheme for qt5ct / qt6ct, part of cosmic-brassday-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> BrassDay, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#1d1c17, #fbf5e7, #fbf5e7, #e3d8bb, #ede3c9, #ede3c9, #1d1c17, #0e0e0d, #1d1c17, #fbf5e7, #f4ecd6, #ede3c9, #77603b, #f4ecd6, #77603b, #9e4e1a, #fbf5e7, #f4ecd6, #fbf5e7, #1d1c17, #67645b
disabled_colors=#9a978c, #fbf5e7, #fbf5e7, #e3d8bb, #ede3c9, #ede3c9, #9a978c, #70614c, #9a978c, #f4ecd6, #f4ecd6, #ede3c9, #e3d8bb, #70614c, #67645b, #67645b, #fbf5e7, #f4ecd6, #fbf5e7, #1d1c17, #e3d8bb
inactive_colors=#1d1c17, #fbf5e7, #fbf5e7, #e3d8bb, #ede3c9, #ede3c9, #1d1c17, #0e0e0d, #1d1c17, #fbf5e7, #f4ecd6, #ede3c9, #77603b, #f4ecd6, #77603b, #9e4e1a, #fbf5e7, #f4ecd6, #fbf5e7, #1d1c17, #67645b
