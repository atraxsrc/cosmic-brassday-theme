# BrassDay for lazygit, part of cosmic-brassday-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/brassday.yml and
# zsh/brassday.zsh sets LG_CONFIG_FILE to "config.yml,brassday.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/brassday.yml"
gui:
  theme:
    activeBorderColor:
      - "#77603B"
      - bold
    inactiveBorderColor:
      - "#E3D8BB"
    searchingActiveBorderColor:
      - "#9E4E1A"
      - bold
    optionsTextColor:
      - "#70614C"
    selectedLineBgColor:
      - "#EDE3C9"
    inactiveViewSelectedLineBgColor:
      - "#FBF5E7"
    cherryPickedCommitFgColor:
      - "#F4ECD6"
    cherryPickedCommitBgColor:
      - "#6F5F36"
    markedBaseCommitFgColor:
      - "#F4ECD6"
    markedBaseCommitBgColor:
      - "#7C602C"
    unstagedChangesColor:
      - "#A63426"
    defaultFgColor:
      - "#1D1C17"
  authorColors:
    "*": "#6F5F36"
